name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CONNECTION_STRING: mongodb://admin:metadataadmin@localhost:27017/
  PORT: 8000
  DISABLE_CAPTURE: true
  BETTER_AUTH_URL: http://127.0.0.1:8080
  TEST_USER_EMAIL: test@test.com
  TEST_USER_PASSWORD: test_password123

jobs:
  build_server:
    name: Build server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Build server
        working-directory: server
        run: |
          yarn install
          yarn build

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mars-server
          path: server/dist/

  build_client:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Build client
        working-directory: client
        run: |
          yarn install
          yarn build

  test_server:
    name: Test server
    runs-on: ubuntu-latest
    needs: build_server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: mars-server
          path: server/dist/

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Start Docker containers
        run: docker compose -f "docker-compose.yml" up -d --build

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Test server
        working-directory: server
        run: |
          yarn install
          yarn test

  test_client:
    name: Test client
    runs-on: ubuntu-latest
    needs: [build_server, test_server, build_client]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Test client components
        working-directory: client
        run: |
          yarn install
          yarn test:components

      - name: Start Docker containers
        run: docker compose -f "docker-compose.yml" up -d --build

      - uses: actions/download-artifact@v7
        with:
          name: mars-server
          path: server/dist/

      - name: Install server dependencies
        working-directory: server
        run: |
          yarn install

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Start server
        working-directory: server
        run: yarn start &

      - name: Create .env file for client
        working-directory: client
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "VITE_PUBLIC_POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}" >> .env
          echo "VITE_POSTHOG_DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "VITE_COLLEGE_SCORECARD_KEY=${{ secrets.VITE_COLLEGE_SCORECARD_KEY }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "TEST_USER_EMAIL=${{ env.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ env.TEST_USER_PASSWORD }}" >> .env

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: yarn test:ui

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
