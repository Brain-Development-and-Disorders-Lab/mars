name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CONNECTION_STRING: mongodb://admin:metadataadmin@localhost:27017/
  PORT: 8000
  DISABLE_CAPTURE: true
  BETTER_AUTH_URL: http://127.0.0.1:8080
  TEST_USER_EMAIL: test@test.com
  TEST_USER_PASSWORD: test_password123

jobs:
  build_server:
    name: Build server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Build server
        working-directory: server
        run: |
          yarn install
          yarn build

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mars-server
          path: server/dist/

  lint_server:
    name: Lint server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Lint server
        working-directory: server
        run: |
          yarn install
          yarn lint

  format_server:
    name: Format server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Check server formatting
        working-directory: server
        run: |
          yarn install
          yarn format:check

  build_client:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Build client
        working-directory: client
        run: |
          yarn install
          yarn build

  lint_client:
    name: Lint client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Lint client
        working-directory: client
        run: |
          yarn install
          yarn lint

  format_client:
    name: Format client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Check client formatting
        working-directory: client
        run: |
          yarn install
          yarn format:check

  test_server:
    name: Test server
    runs-on: ubuntu-latest
    needs: build_server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: mars-server
          path: server/dist/

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Start MongoDB container
        run: docker compose -f "docker-compose.yml" up -d database

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Test server
        working-directory: server
        run: |
          yarn install
          yarn test

  test_client_components_libraries:
    name: Test client components and library functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Run client components and library functions test suites
        working-directory: client
        run: |
          yarn install
          yarn test:components
          yarn test:lib

  test_client_integration:
    name: Test client integration
    runs-on: ubuntu-latest
    needs: [build_server, build_client]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: |
            client/yarn.lock
            server/yarn.lock

      - name: Start MongoDB container
        run: docker compose -f "docker-compose.yml" up -d database

      - uses: actions/download-artifact@v7
        with:
          name: mars-server
          path: server/dist/

      - name: Install server dependencies
        working-directory: server
        run: |
          yarn install

      - name: Create .env file for server
        working-directory: server
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "PORT=${{ env.PORT }}" >> .env
          echo "NODE_ENV=development" >> .env
          echo "ORCID_SANDBOX_CLIENT_ID=${{ secrets.ORCID_SANDBOX_CLIENT_ID }}" >> .env
          echo "ORCID_SANDBOX_CLIENT_SECRET=${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}" >> .env
          echo "POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}" >> .env

      - name: Start server
        working-directory: server
        run: yarn start &

      - name: Create .env file for client
        working-directory: client
        run: |
          touch .env
          echo "CONNECTION_STRING=${{ env.CONNECTION_STRING }}" >> .env
          echo "VITE_PUBLIC_POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}" >> .env
          echo "VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}" >> .env
          echo "VITE_POSTHOG_DISABLE_CAPTURE=${{ env.DISABLE_CAPTURE }}" >> .env
          echo "VITE_COLLEGE_SCORECARD_KEY=${{ secrets.VITE_COLLEGE_SCORECARD_KEY }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }}" >> .env
          echo "TEST_USER_EMAIL=${{ env.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ env.TEST_USER_PASSWORD }}" >> .env

      - name: Build client for testing
        working-directory: client
        run: |
          yarn install
          yarn build:test

      - name: Get Playwright version
        id: playwright-version
        working-directory: client
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: yarn test:integration

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
